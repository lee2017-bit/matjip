name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 0"   # every Monday 03:17 KST: refresh the rankings
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (weekly schedule refreshes a quarter of the areas, cached data otherwise)
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          LOOKUP_API: ${{ vars.LOOKUP_API || 'https://matjip-lookup.jaewon-lee2017.workers.dev' }}
        run: python3 build.py ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--rotate' || '' }}
      - name: Cross-check new places on Kakao Map (weekly, up to 200) and rebuild
        if: github.event_name != 'push'
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          LOOKUP_API: ${{ vars.LOOKUP_API || 'https://matjip-lookup.jaewon-lee2017.workers.dev' }}
        run: python3 tools/kakao_check.py --limit 200 && python3 build.py
      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/cache data/kakao_check.json
          git diff --cached --quiet || git commit -m "Refresh rankings" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
